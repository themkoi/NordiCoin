[workspace]
[package]
name = "nordicoin-connection-test"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-nrf = { version = "0.11.0", default-features = false, features = [
    "defmt",
    "time-driver-rtc1",
    "unstable-pac",
    "rt",
    "nrf52805",
] }
embassy-executor = { version = "0.10", default-features = false, features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
    "executor-interrupt",
] }
embassy-time = { version = "0.5", default-features = false, features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-futures = "0.1"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
static_cell = "2"
heapless = "0.9"

# BLE stack (nrf-sdc + nrf-mpsl + trouble-host)
nrf-sdc = { version = "0.4", default-features = false, features = [
    "defmt", "peripheral", "central", "nrf52805",
] }
nrf-mpsl = { version = "0.3", default-features = false, features = [
    "defmt", "nrf52805",
] }
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }
trouble-host = { version = "0.7", features = [
    "derive", "scan", "central", "peripheral", "gatt", "defmt",
] }

[profile.release]
opt-level = "z"
debug = 2
lto = true
codegen-units = 1 

[profile.dev]
opt-level = "z"
debug = 2
lto = true
codegen-units = 1

[patch.crates-io]
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55" }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55" }
