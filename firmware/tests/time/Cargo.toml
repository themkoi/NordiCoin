[workspace]

[package]
name = "nordicoin-time"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-nrf = { version = "0.11", default-features = false, features = [
    "defmt",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "rt",
    "nrf52805",
] }
embassy-executor = { version = "0.10", default-features = false, features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
    "executor-interrupt",
] }
embassy-time = { version = "0.5", default-features = false, features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"

[profile.release]
opt-level = "z"
debug = 2
lto = true
codegen-units = 1 

[profile.dev]
opt-level = "z"
debug = 2
lto = true
codegen-units = 1
